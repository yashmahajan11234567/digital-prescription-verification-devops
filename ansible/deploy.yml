---
- name: Deploy RxVerify to AWS EC2
  hosts: web
  become: true
  vars_files:
    - secrets.yml
  vars:
    app_directory: /opt/rxverify
    image_name: rxverify:latest
    container_name: rxverify-app
    data_volume: rxverify_data
    # SQLite database configuration (application convention)
    database_url: "sqlite:///instance/prescriptions.db"

  pre_tasks:
    - name: Ensure a non-placeholder app secret is supplied
      ansible.builtin.assert:
        that:
          - app_secret_key != "replace-this-with-a-long-random-secret"
          - app_secret_key | length >= 32
        fail_msg: "Create ansible/secrets.yml with a secure app_secret_key before deployment."

  tasks:
    - name: Update Ubuntu package metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker Engine and Python Docker SDK
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
      register: docker_install

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        mode: "0755"

    - name: Copy Flask entry point and Docker build files
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ app_directory }}/{{ item }}"
        mode: "0644"
      loop:
        - app.py
        - config.py
        - requirements.txt
        - Dockerfile

    - name: Copy application source code
      ansible.builtin.copy:
        src: ../src/
        dest: "{{ app_directory }}/src/"
        mode: "0644"

    - name: Copy application templates
      ansible.builtin.copy:
        src: ../templates/
        dest: "{{ app_directory }}/templates/"
        mode: "0644"

    - name: Copy application static files
      ansible.builtin.copy:
        src: ../static/
        dest: "{{ app_directory }}/static/"
        mode: "0644"

    - name: Build the RxVerify Docker image on EC2
      ansible.builtin.command: docker build --tag {{ image_name }} .
      args:
        chdir: "{{ app_directory }}"
      changed_when: true

    - name: Create persistent Docker volume for prescription data
      community.docker.docker_volume:
        name: "{{ data_volume }}"
      register: volume_create

    - name: Ensure SQLite database volume directory has correct ownership for appuser
      ansible.builtin.file:
        path: "/var/lib/docker/volumes/{{ data_volume }}/_data"
        owner: "999"
        group: "999"
        mode: "0755"

    - name: Ensure SQLite database file has correct ownership for appuser (if exists)
      ansible.builtin.file:
        path: "/var/lib/docker/volumes/{{ data_volume }}/_data/prescriptions.db"
        owner: "999"
        group: "999"
        mode: "0644"
      ignore_errors: yes

    - name: Deploy RxVerify application container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:5000"
        volumes:
          - "{{ data_volume }}:/app/instance"
        env:
          SECRET_KEY: "{{ app_secret_key }}"
          FLASK_ENV: "production"
          DATABASE_URL: "{{ database_url }}"
        # Wait for container to be healthy
        healthcheck:
          test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 15s

    - name: Check the application health endpoint on EC2
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        return_content: true
        status_code: 200
      register: healthcheck
      retries: 10
      delay: 5
      until: healthcheck.status == 200

    - name: Show health result
      ansible.builtin.debug:
        var: healthcheck.json
