{% extends "base.html" %}
{% block title %}Issue prescription | RxVerify{% endblock %}
{% block content %}
<div class="page-heading"><p class="eyebrow">CLINIC PORTAL</p><h1>Issue a prescription</h1><p>Every field is stored locally and linked to one verification ID.</p></div>
<form class="card form-grid" method="post">
  <label>Patient name<input name="patient_name" value="{{ form.get('patient_name', '') }}" required></label>
  <label>Patient reference<input name="patient_reference" placeholder="e.g. UHID-1024" value="{{ form.get('patient_reference', '') }}" required></label>
  <label>Issuing doctor<input name="doctor_name" value="{{ form.get('doctor_name', current_user.name) }}" required></label>
  <label>Clinic name<input name="clinic_name" value="{{ form.get('clinic_name', '') }}" required></label>
  <label>Medicine name<input name="medicine_name" value="{{ form.get('medicine_name', '') }}" required></label>
  <label>Dosage<input name="dosage" placeholder="e.g. 500 mg, twice daily" value="{{ form.get('dosage', '') }}" required></label>
  <label class="full">Instructions<textarea name="instructions" required>{{ form.get('instructions', '') }}</textarea></label>
  <label>Issue date<input type="date" name="issue_date" value="{{ form.get('issue_date', '') }}" required></label>
  <div class="full"><button class="button" type="submit">Create verification ID</button></div>
</form>
{% endblock %}
