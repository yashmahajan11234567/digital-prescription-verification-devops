{% extends "base.html" %}
{% block title %}Register Doctor | RxVerify{% endblock %}
{% block content %}
<div class="page-heading">
  <h1>Register Doctor</h1>
  <p class="subtitle">Add a doctor to {{ hospital.name }}.</p>
</div>

<form class="card form-grid" action="{{ url_for('admin.add_doctor_post', hospital_id=hospital.id) }}" method="post">
  <div class="field full">
    <label for="name">Doctor name <span class="required"></span></label>
    <input type="text" id="name" name="name" value="{{ form.name or '' }}" required autocomplete="name">
  </div>
  <div class="field">
    <label for="email">Email <span class="required"></span></label>
    <input type="email" id="email" name="email" value="{{ form.email or '' }}" required autocomplete="email">
  </div>
  <div class="field">
    <label for="password">Password <span class="required"></span></label>
    <input type="password" id="password" name="password" required autocomplete="new-password">
  </div>
  <div class="field full">
    <button class="button" type="submit">Register doctor</button>
    <a class="button ghost" href="{{ url_for('admin.hospital_detail', hospital_id=hospital.id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
