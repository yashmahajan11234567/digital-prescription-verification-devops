{% extends "base.html" %}
{% block title %}Add Pharmacist | RxVerify{% endblock %}
{% block content %}
<div class="page-heading">
  <p class="eyebrow">ADMIN PORTAL</p>
  <h1>Add Pharmacist</h1>
  <p>Register a new pharmacist with auto-generated PHARM-XXX identifier.</p>
</div>

<form class="card form-grid" method="post">
  <label>Pharmacist name<input name="name" value="{{ form.name or '' }}" required></label>
  <label>Email<input type="email" name="email" value="{{ form.email or '' }}" required></label>
  <label>Password<input type="password" name="password" required autocomplete="new-password"></label>
  <div class="full"><button class="button" type="submit">Register pharmacist</button></div>
</form>
{% endblock %}
