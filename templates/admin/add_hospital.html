{% extends "base.html" %}
{% block title %}Add Hospital | RxVerify{% endblock %}
{% block content %}
<div class="page-heading">
  <h1>Add Hospital</h1>
  <p class="subtitle">Register a new hospital in the system.</p>
</div>

<form class="card form-grid" action="{{ url_for('admin.add_hospital_post') }}" method="post">
  <div class="field full">
    <label for="name">Hospital name <span class="required"></span></label>
    <input type="text" id="name" name="name" value="{{ form.name or '' }}" required autocomplete="off">
  </div>
  <div class="field full">
    <label for="address">Address</label>
    <textarea id="address" name="address">{{ form.address or '' }}</textarea>
  </div>
  <div class="field">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" value="{{ form.phone or '' }}">
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.email or '' }}">
  </div>
  <div class="field full">
    <button class="button" type="submit">Create hospital</button>
    <a class="button ghost" href="{{ url_for('admin.hospitals') }}">Cancel</a>
  </div>
</form>
{% endblock %}
